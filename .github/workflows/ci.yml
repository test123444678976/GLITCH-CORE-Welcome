name: Welcome CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build and GTK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-gi gir1.2-gtk-3.0
      - name: Compile native backend
        run: make native
      - name: Run Python tests
        run: make test
      - name: Static and CLI checks
        run: make check
      - name: Validate package metadata
        run: python3 -m json.tool packaging/glitch-app.json > /dev/null
